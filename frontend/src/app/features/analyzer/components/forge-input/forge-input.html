<form class="forge" (ngSubmit)="submit()" #f="ngForm">
  <label class="field pkg">
    <span>Package <em>name or npm link</em></span>
    <input name="name" [ngModel]="name" (ngModelChange)="onNameChange($event)"
           (blur)="normalizeName(); onBlur()" (focus)="showSuggestions.set(true)"
           (keydown.escape)="showSuggestions.set(false)"
           placeholder="rxjs or https://www.npmjs.com/package/rxjs"
           autocomplete="off" spellcheck="false" required />
    <small class="hint" aria-live="polite">
      @if (loading()) {
        Fetching versions of {{ resolved() }}…
      } @else if (resolved() && versions().length) {
        {{ versions().length }} versions of {{ resolved() }}
      } @else if (resolved()) {
        No versions found for {{ resolved() }}
      } @else if (name.trim()) {
        Not a valid package name or npm link
      }
    </small>
    @if (showSuggestions() && (suggestions.isLoading() || suggestions.value().length)) {
      <ul class="suggestions">
        @if (suggestions.isLoading()) {
          <li class="status">Searching…</li>
        } @else {
          @for (s of suggestions.value(); track s.name) {
            <li>
              <button type="button" (mousedown)="$event.preventDefault()" (click)="selectSuggestion(s)">
                <span class="s-name">{{ s.name }}</span>
                @if (s.description) { <span class="s-desc">{{ s.description }}</span> }
              </button>
            </li>
          }
        }
      </ul>
    }
  </label>
  <label class="field">
    <span>From version</span>
    <select name="from" [ngModel]="from()" (ngModelChange)="onFromChange($event)"
            required [disabled]="!versions().length">
      <option value="" disabled selected>{{ versions().length ? 'Pick a version' : '—' }}</option>
      @for (v of versions(); track v) {
        <option [value]="v">{{ v }}</option>
      }
    </select>
  </label>
  <label class="field">
    <span>To version</span>
    <select name="to" [ngModel]="to()" (ngModelChange)="to.set($event)"
            required [disabled]="!from()">
      <option value="" disabled selected>{{ from() ? 'Pick a version' : '—' }}</option>
      @for (v of toOptions(); track v) {
        <option [value]="v">{{ v }}</option>
      }
    </select>
  </label>
  <button type="submit" [disabled]="!valid">Forge analysis</button>
</form>
